name: CI

# Checks that need no interactive desktop: the TypeScript build, the npm tests other than the
# end-to-end ones (they open real windows), the Rust unit tests, and that every Rust integration
# test compiles. The desktop tests (helper/tests) run on a real desktop, not here.
#
# Actions are pinned by commit SHA (the tag in the comment); Dependabot (.github/dependabot.yml)
# proposes updates. The Rust toolchain is rust-toolchain.toml's.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Build the helper and its test binaries
        run: cargo test --locked --manifest-path helper/Cargo.toml --no-run

      - name: Rust unit tests
        run: cargo test --locked --manifest-path helper/Cargo.toml --bins

      - name: npm tests
        env:
          DESKPASS_NO_DESKTOP: "1"
        run: npm test
